<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date-Date Calculator</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Retro Skeuomorphic & Classic Android Styles */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #d1d5db;
        }

        .android-status-bar {
            background: linear-gradient(to bottom, #111111, #222222);
        }

        .app-header {
            background: linear-gradient(to bottom, #f3f4f6, #d1d5db);
            border-bottom: 2px solid #9ca3af;
        }

        .skeuo-btn {
            background: linear-gradient(to bottom, #ffffff 0%, #e5e7eb 50%, #d1d5db 100%);
            border: 1px solid #9ca3af;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 2px 4px rgba(0, 0, 0, 0.15);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .skeuo-btn:active {
            background: linear-gradient(to bottom, #d1d5db 0%, #e5e7eb 100%);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .skeuo-input {
            background: linear-gradient(to bottom, #ffffff 0%, #f3f4f6 100%);
            border: 1px solid #9ca3af;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Stylized Green Output Box Styles */
        .green-result-box {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border: 1px solid #047857;
        }

        /* Hide scrollbars for slick look */
        select::-webkit-scrollbar {
            width: 4px;
        }
        select::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-4">

    <!-- Mobile Device Container -->
    <div class="w-full max-w-md bg-white rounded-lg overflow-hidden shadow-2xl border border-gray-400 flex flex-col min-h-[680px]">

        <!-- Classic Android Top Status Bar -->
        <div class="android-status-bar text-white px-3 py-1 text-xs flex justify-between items-center select-none">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-microchip text-gray-400 text-[10px]"></i>
                <span class="font-bold text-gray-300">3G</span>
                <i class="fa-solid fa-signal text-xs"></i>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-question text-gray-300"></i>
                <span id="status-clock" class="font-bold">10:30 AM</span>
            </div>
        </div>

        <!-- App Header (Date-Date) -->
        <div class="app-header px-3 py-2 flex items-center justify-between border-b border-gray-300">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded bg-gradient-to-b from-blue-600 to-blue-800 flex items-center justify-center text-white shadow">
                    <i class="fa-solid fa-arrow-right-from-bracket text-sm transform rotate-180"></i>
                </div>
                <h1 class="text-xl font-semibold text-blue-900 tracking-tight">Baitule Jewellers</h1>
            </div>
            <div class="flex items-center gap-2 text-gray-700">
                <button title="Calendar Plus Days" class="p-1 hover:bg-gray-200 rounded"><i class="fa-solid fa-calendar-plus text-lg"></i></button>
                <button title="Date Difference Mode" class="p-1 hover:bg-gray-200 rounded border-b-2 border-blue-600"><i class="fa-solid fa-calendar-days text-lg text-blue-800"></i></button>
            </div>
        </div>

        <!-- Main Body -->
        <div class="p-4 flex-1 flex flex-col justify-between bg-white">
            <form id="date-form" onsubmit="event.preventDefault();">
                
                <!-- Initial Date Section -->
                <div class="mb-5">
                    <h2 class="text-center text-2xl font-bold text-black mb-2">Initial Date</h2>
                    <div class="grid grid-cols-12 gap-1 items-center">
                        <div class="col-span-2 text-center">
                            <label class="block text-xs font-semibold text-gray-800 mb-1">Day</label>
                            <select id="init-day" onchange="onDateInputChange('init')" class="skeuo-input w-full py-2 px-1 text-center font-bold text-gray-900 rounded cursor-pointer">
                                <!-- Options populated by JS -->
                            </select>
                        </div>
                        <div class="col-span-4 text-center">
                            <label class="block text-xs font-semibold text-gray-800 mb-1">Month</label>
                            <select id="init-month" onchange="onDateInputChange('init')" class="skeuo-input w-full py-2 px-1 text-center font-bold text-gray-900 rounded cursor-pointer">
                                <!-- Months populated by JS -->
                            </select>
                        </div>
                        <div class="col-span-3 text-center">
                            <label class="block text-xs font-semibold text-gray-800 mb-1">Year</label>
                            <select id="init-year" onchange="onDateInputChange('init')" class="skeuo-input w-full py-2 px-1 text-center font-bold text-gray-900 rounded cursor-pointer">
                                <!-- Years 2015-2050 populated by JS -->
                            </select>
                        </div>
                        <div class="col-span-3 text-center">
                            <label class="block text-xs font-semibold text-gray-800 mb-1">Week Day</label>
                            <div id="init-weekday" class="py-2 text-sm font-bold text-gray-800">Friday</div>
                        </div>
                    </div>
                </div>

                <!-- Final Date Section -->
                <div class="mb-5">
                    <h2 class="text-center text-2xl font-bold text-black mb-2">Final Date</h2>
                    <div class="grid grid-cols-12 gap-1 items-center">
                        <div class="col-span-2 text-center">
                            <label class="block text-xs font-semibold text-gray-800 mb-1">Day</label>
                            <select id="final-day" onchange="onDateInputChange('final')" class="skeuo-input w-full py-2 px-1 text-center font-bold text-gray-900 rounded cursor-pointer">
                                <!-- Options populated by JS -->
                            </select>
                        </div>
                        <div class="col-span-4 text-center">
                            <label class="block text-xs font-semibold text-gray-800 mb-1">Month</label>
                            <select id="final-month" onchange="onDateInputChange('final')" class="skeuo-input w-full py-2 px-1 text-center font-bold text-gray-900 rounded cursor-pointer">
                                <!-- Months populated by JS -->
                            </select>
                        </div>
                        <div class="col-span-3 text-center">
                            <label class="block text-xs font-semibold text-gray-800 mb-1">Year</label>
                            <select id="final-year" onchange="onDateInputChange('final')" class="skeuo-input w-full py-2 px-1 text-center font-bold text-gray-900 rounded cursor-pointer">
                                <!-- Years 2015-2050 populated by JS -->
                            </select>
                        </div>
                        <div class="col-span-3 text-center">
                            <label class="block text-xs font-semibold text-gray-800 mb-1">Week Day</label>
                            <div id="final-weekday" class="py-2 text-sm font-bold text-gray-800">Wednesday</div>
                        </div>
                    </div>
                </div>

            </form>

            <!-- Dual Green Result Display Box -->
            <div id="result-box" class="space-y-3 my-2">
                <!-- Green Box Row 1: Months and Days -->
                <div class="green-result-box text-white rounded-xl p-3 text-center">
                    <div class="text-xs uppercase tracking-wider font-semibold text-emerald-100 mb-1">Months & Days</div>
                    <div id="result-months-days" class="text-2xl font-extrabold tracking-wide">0 Months 0 Days</div>
                </div>

                <!-- Green Box Row 2: Years, Months and Days -->
                <div class="green-result-box text-white rounded-xl p-3 text-center">
                    <div class="text-xs uppercase tracking-wider font-semibold text-emerald-100 mb-1">Years, Months & Days</div>
                    <div id="result-years-months-days" class="text-2xl font-extrabold tracking-wide">0 Years 0 Months 0 Days</div>
                </div>

                <!-- Total Days Footnote -->
                <div class="text-center text-xs text-gray-500 font-medium">
                    Total Days: <span id="total-days-count" class="font-bold text-gray-700">0</span> days
                    <span id="swap-notice" class="hidden text-amber-600 font-semibold ml-1">(Initial date is newer)</span>
                </div>
            </div>

            <!-- Quick Preset Helper Buttons -->
            <div class="flex justify-around mt-2 pt-3 border-t border-gray-200 text-xs text-gray-600">
                <button type="button" onclick="setPreset('today')" class="hover:text-blue-700 underline">Reset Both to Today</button>
                <button type="button" onclick="swapDates()" class="hover:text-blue-700 underline"><i class="fa-solid fa-arrows-rotate mr-1"></i>Swap Dates</button>
                <button type="button" onclick="setPreset('sample')" class="hover:text-blue-700 underline">Load Sample Dates</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        
        const weekDays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        // Initialize UI on window load
        window.onload = function () {
            populateYears('init');
            populateYears('final');
            populateMonths('init');
            populateMonths('final');

            // Default BOTH upper and lower dates to TODAY's date
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();
            const currentDay = today.getDate();

            setDateValues('init', currentDay, currentMonth, currentYear);
            setDateValues('final', currentDay, currentMonth, currentYear);

            // Real-time clock update for status bar
            updateClock();
            setInterval(updateClock, 10000);

            // Initial calculation
            calculateDifference();
        };

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('status-clock').textContent = `${hours}:${minutes} ${ampm}`;
        }

        function populateYears(prefix) {
            const select = document.getElementById(`${prefix}-year`);
            select.innerHTML = '';
            for (let yr = 2015; yr <= 2050; yr++) {
                const opt = document.createElement('option');
                opt.value = yr;
                opt.textContent = yr;
                select.appendChild(opt);
            }
        }

        function populateMonths(prefix) {
            const select = document.getElementById(`${prefix}-month`);
            select.innerHTML = '';
            monthNames.forEach((month, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = month;
                select.appendChild(opt);
            });
        }

        function populateDays(prefix, year, month, selectedDay) {
            const select = document.getElementById(`${prefix}-day`);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            select.innerHTML = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                select.appendChild(opt);
            }

            if (selectedDay > daysInMonth) {
                select.value = daysInMonth;
            } else if (selectedDay) {
                select.value = selectedDay;
            }
        }

        function getFullYear(prefix) {
            return parseInt(document.getElementById(`${prefix}-year`).value, 10) || new Date().getFullYear();
        }

        function onDateInputChange(prefix) {
            const year = getFullYear(prefix);
            const month = parseInt(document.getElementById(`${prefix}-month`).value, 10);
            const currentDay = parseInt(document.getElementById(`${prefix}-day`).value, 10) || 1;
            
            populateDays(prefix, year, month, currentDay);
            updateWeekDay(prefix);
            
            // Auto-update calculations instantly when input changes
            calculateDifference();
        }

        function updateWeekDay(prefix) {
            const year = getFullYear(prefix);
            const month = parseInt(document.getElementById(`${prefix}-month`).value, 10);
            const day = parseInt(document.getElementById(`${prefix}-day`).value, 10);

            if (!isNaN(year) && !isNaN(month) && !isNaN(day)) {
                const date = new Date(year, month, day);
                document.getElementById(`${prefix}-weekday`).textContent = weekDays[date.getDay()];
            }
        }

        function setDateValues(prefix, day, monthIdx, year) {
            const clampedYear = Math.max(2015, Math.min(2050, year));
            document.getElementById(`${prefix}-year`).value = clampedYear;
            document.getElementById(`${prefix}-month`).value = monthIdx;
            
            populateDays(prefix, clampedYear, monthIdx, day);
            document.getElementById(`${prefix}-day`).value = day;
            updateWeekDay(prefix);
        }

        function getDateObject(prefix) {
            const year = getFullYear(prefix);
            const month = parseInt(document.getElementById(`${prefix}-month`).value, 10);
            const day = parseInt(document.getElementById(`${prefix}-day`).value, 10);
            return new Date(year, month, day);
        }

        // Real-Time Difference Calculation (Total Months + Days AND Years + Months + Days)
        function calculateDifference() {
            let d1 = getDateObject('init');
            let d2 = getDateObject('final');

            let isSwapped = false;
            if (d1 > d2) {
                const temp = d1;
                d1 = d2;
                d2 = temp;
                isSwapped = true;
            }

            // Total Days Calculation
            const utc1 = Date.UTC(d1.getFullYear(), d1.getMonth(), d1.getDate());
            const utc2 = Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate());
            const totalDays = Math.floor((utc2 - utc1) / (1000 * 60 * 60 * 24));

            // Breakdown Calculation: Years, Months, Days
            let y1 = d1.getFullYear();
            let m1 = d1.getMonth();
            let day1 = d1.getDate();

            let y2 = d2.getFullYear();
            let m2 = d2.getMonth();
            let day2 = d2.getDate();

            let years = y2 - y1;
            let months = m2 - m1;
            let days = day2 - day1;

            if (days < 0) {
                months--;
                const prevMonthDate = new Date(y2, m2, 0);
                days += prevMonthDate.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            // Format Row 2: Years, Months & Days
            let ymdText = "";
            ymdText += `${years} Year${years !== 1 ? 's' : ''} `;
            ymdText += `${months} Month${months !== 1 ? 's' : ''} `;
            ymdText += `${days} Day${days !== 1 ? 's' : ''}`;

            // Format Row 1: Total Months & Days
            const totalMonths = (years * 12) + months;
            let mdText = `${totalMonths} Month${totalMonths !== 1 ? 's' : ''} ${days} Day${days !== 1 ? 's' : ''}`;

            // Update DOM Elements
            document.getElementById('result-months-days').textContent = mdText;
            document.getElementById('result-years-months-days').textContent = ymdText;
            document.getElementById('total-days-count').textContent = totalDays;

            const swapNotice = document.getElementById('swap-notice');
            if (isSwapped) {
                swapNotice.classList.remove('hidden');
            } else {
                swapNotice.classList.add('hidden');
            }
        }

        // Helper Preset Functions
        function setPreset(type) {
            const today = new Date();
            if (type === 'today') {
                setDateValues('init', today.getDate(), today.getMonth(), today.getFullYear());
                setDateValues('final', today.getDate(), today.getMonth(), today.getFullYear());
            } else if (type === 'sample') {
                // Example 17 months 1 day difference
                setDateValues('init', 15, 0, 2024); // Jan 15, 2024
                setDateValues('final', 16, 5, 2025); // Jun 16, 2025
            }
            calculateDifference();
        }

        function swapDates() {
            const initDay = document.getElementById('init-day').value;
            const initMonth = document.getElementById('init-month').value;
            const initYear = document.getElementById('init-year').value;

            const finalDay = document.getElementById('final-day').value;
            const finalMonth = document.getElementById('final-month').value;
            const finalYear = document.getElementById('final-year').value;

            setDateValues('init', finalDay, finalMonth, finalYear);
            setDateValues('final', initDay, initMonth, initYear);
            calculateDifference();
        }
    </script>
</body>
</html>
